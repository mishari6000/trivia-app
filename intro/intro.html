<!doctype html>

<style>

           font-family: Taj; color: #fff; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  .abs { position: absolute; box-sizing: border-box; }
  .mask { position: absolute; overflow: hidden; }
  .in { display: block; white-space: nowrap; }
  .row { display: flex; align-items: center; }
</style>

<div id="stage"></div>
<script>
// ---------------------------------------------------------------- constants
const W = 1080, H = 1920, BEAT = 0.5, DURATION = 20;
const C = {
  bg: '#0A1620', surface: '#122230', raised: '#1A2D3C', border: 'rgba(255,255,255,0.08)',
  borderStrong: 'rgba(255,255,255,0.18)', muted: '#9DB1BF', green: '#22DD82', ink: '#0A1620',
  white: '#FFFFFF', glass: 'rgba(255,255,255,0.12)',
};

// ---------------------------------------------------------------- easing (pure functions of time)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const expoIn = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, 10 * (x - 1)));
/** Damped spring, ~2% overshoot, settles in ~0.4 s. `s` is seconds since start. */
function spring(s) {
  if (s <= 0) return 0;
  const z = 0.78, w = 14, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + ((z * w) / wd) * Math.sin(wd * s));
}
const sp = (t, t0) => spring(t - t0);
const ex = (t, t0, d) => expoOut((t - t0) / d);
/** Short press: 0 → 1 → 0 over 0.18 s. */
const press = (t, t0) => Math.sin(Math.PI * clamp((t - t0) / 0.18));

// ---------------------------------------------------------------- DOM helpers (structure only)
const stage = document.getElementById('stage');
function el(parent, style = {}, html = '', id) {
  const n = document.createElement('div');
  n.className = 'abs';
  Object.assign(n.style, style);
  if (html) n.innerHTML = html;
  if (id) n.id = id;
  parent.appendChild(n);
  return n;
}
function layer(name) {
  const n = document.createElement('div');
  n.className = 'layer';
  n.id = 'layer-' + name;
  stage.appendChild(n);
  return n;
}
/** A word that is revealed by a mask: returns { box, inner }. */
function maskWord(parent, text, style, innerStyle = {}) {
  const box = document.createElement('div');
  box.className = 'mask';
  Object.assign(box.style, style);
  const inner = document.createElement('span');
  inner.className = 'in';
  inner.textContent = text;
  Object.assign(inner.style, innerStyle);
  box.appendChild(inner);
  parent.appendChild(box);
  return { box, inner };
}
/** Mask position: below (100) → in place (0) → above (−100). */
function maskY(t, tin, tout = Infinity, din = 0.45, dout = 0.32) {
  return (1 - ex(t, tin, din)) * 100 - ex(t, tout, dout) * 100;
}
function rectOf(id) {
  const r = document.getElementById(id).getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
}
/** Two stacked spans that roll from one value to the next. */
function roller(parent, style, innerStyle) {
  const box = document.createElement('div');
  box.className = 'mask';
  Object.assign(box.style, style);
  const a = document.createElement('span');
  const b = document.createElement('span');
  for (const s of [a, b]) {
    s.className = 'in';
    Object.assign(s.style, { position: 'absolute', left: 0, right: 0, textAlign: 'center' }, innerStyle);
    box.appendChild(s);
  }
  parent.appendChild(box);
  return { box, a, b };
}
function setRoller(r, values, times, t) {
  let k = 0;
  while (k + 1 < times.length && t >= times[k + 1]) k++;
  if (k === 0) {
    r.a.textContent = values[0];
    r.b.textContent = values[0];
    r.a.style.transform = 'translateY(0%)';
    r.b.style.transform = 'translateY(100%)';
    return;
  }
  const e = ex(t, times[k], 0.28);
  r.a.textContent = values[k - 1];
  r.b.textContent = values[k];
  r.a.style.transform = `translateY(${-100 * e}%)`;
  r.b.style.transform = `translateY(${100 * (1 - e)}%)`;
}

// ---------------------------------------------------------------- scene windows
const S = {
  hook: [0, 2.45], welcome: [1.95, 6.05], game: [6.0, 12.45], results: [11.95, 16.45], end: [15.95, 20.1],
};
const visible = (name, t) => t >= S[name][0] && t < S[name][1];
/** Camera: zoom about a focus point. z goes z0 → z1 exponentially across the window. */
function camera(node, t, t0, t1, z0, z1, f) {
  const p = clamp((t - t0) / (t1 - t0));
  const z = z0 * Math.pow(z1 / z0, p);
  node.style.transform = `translate(${f.x * (1 - z)}px, ${f.y * (1 - z)}px) scale(${z})`;
}
const mixPoint = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p) });

// =============================================================== HOOK
const hook = layer('hook');
const hookLine1 = document.createElement('div');
Object.assign(hookLine1.style, { position: 'absolute', left: 0, right: 0, top: '590px', display: 'flex',
  justifyContent: 'center', gap: '40px', height: '260px' });
hook.appendChild(hookLine1);

function inlineMask(parent, text, color) {

  const inner = document.createElement('span');

  inner.textContent = text;
  Object.assign(inner.style, big, { color });
  box.appendChild(inner);
  parent.appendChild(box);
  return { box, inner };
}
const hW1 = inlineMask(hookLine1, 'تظن إنك', C.white);

// =============================================================== WELCOME

welcome.style.background = C.bg;

  { fontWeight: 800, fontSize: '68px', lineHeight: '108px' });
const wHello = maskWord(wContent, 'هلا والله!', { right: '70px', top: '320px', height: '150px' },
  { fontWeight: 800, fontSize: '110px', lineHeight: '150px' });
const wTag = maskWord(wContent, 'جاهز تتحدّى معلوماتك؟', { right: '70px', top: '470px', height: '84px' },
  { fontWeight: 500, fontSize: '58px', lineHeight: '84px', color: C.muted });
const banner = el(wContent, { left: '70px', right: '70px', top: '610px', height: '230px', borderRadius: '66px',
  background: C.raised, border: `2px solid ${C.border}` });
el(banner, { left: '40px', top: '38px', width: '150px', height: '150px', borderRadius: '75px',
  border: `12px solid ${C.white}` });
el(banner, { left: '40px', top: '38px', width: '150px', height: '150px', display: 'flex', flexDirection: 'column',
  alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '54px', lineHeight: '56px' },
  '15<span style="font-weight:500;font-size:26px;line-height:30px">ثانية</span>');
el(banner, { right: '50px', top: '48px', fontWeight: 800, fontSize: '46px', lineHeight: '70px', whiteSpace: 'nowrap' },

el(banner, { right: '50px', top: '122px', fontWeight: 500, fontSize: '38px', lineHeight: '60px', color: C.muted,
  whiteSpace: 'nowrap' }, 'وعندك 50/50 مرة وحدة بكل لعبة!');
const wSection = maskWord(wContent, 'اختار فئتك', { right: '70px', top: '900px', height: '90px' },

const CARDS = [

  { slug: 'geography', label: 'جغرافيا' }, { slug: 'history', label: 'تاريخ' },

const cards = CARDS.map((c, i) => {

  el(card, { left: 0, top: '230px', width: '100%', height: '162px',
    background: 'linear-gradient(180deg, rgba(18,34,48,0) 0%, #122230 100%)' });
  const chips = el(card, { right: '22px', top: '22px', display: 'flex', gap: '12px' });

      fontWeight: 700, fontSize: '32px', lineHeight: '46px' });

  el(card, { left: '28px', right: '28px', top: '488px', height: '106px', borderRadius: '53px', background: C.bg,
    display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '44px' },
    'ابدأ', c.slug === 'geography' ? 'geo-start' : undefined);

});

// =============================================================== GAME
const game = layer('game');
game.style.background = C.bg;

el(game, { left: '440px', top: '474px', width: '200px', textAlign: 'center', fontWeight: 500, fontSize: '34px',

const ffPill = el(game, { right: '100px', top: '950px', width: '540px', height: '120px', borderRadius: '60px',
  background: C.surface, border: `3px solid ${C.borderStrong}`, overflow: 'hidden' }, '', 'ff');
const ffLabel = roller(ffPill, { left: 0, top: 0, width: '100%', height: '114px' },
  { fontWeight: 800, fontSize: '42px', lineHeight: '114px' });
const ANSWERS = ['الصين', 'الولايات المتحدة', 'كندا', 'روسيا'];
const answers = ANSWERS.map((text, i) => {
  const row = el(game, { left: '100px', right: '100px', top: 1100 + i * 145 + 'px', height: '128px',
    borderRadius: '48px', border: `3px dashed ${C.borderStrong}` }, '', `ans-${i}`);
  const fill = el(row, { left: '-3px', right: '-3px', top: '-3px', bottom: '-3px', borderRadius: '48px',
    background: C.surface, border: `3px solid ${C.border}` });
  const label = el(row, { right: '52px', top: 0, height: '122px', display: 'flex', alignItems: 'center',
    fontWeight: 500, fontSize: '48px', whiteSpace: 'nowrap' }, text);
  const icon = el(row, { left: '30px', top: '20px', width: '82px', height: '82px' }, '', `ans-${i}-icon`);
  return { row, fill, label, icon };
});
const CAPTIONS = [
  { text: '15 ثانية لكل سؤال', tin: 7.5, tout: 8.0 },
  { text: '50/50 · مرة وحدة', tin: 9.5, tout: 10.0 },
  { text: 'صح عليك!', tin: 11.0, tout: 11.95 },
];
const captions = CAPTIONS.map((c) =>
  Object.assign(maskWord(game, c.text, { left: 0, right: 0, top: '1700px', height: '90px', textAlign: 'center' },
    { fontWeight: 800, fontSize: '60px', lineHeight: '90px' }), c));

// =============================================================== RESULTS
const results = layer('results');
results.style.background = C.bg;
const resCard = el(results, { left: '90px', right: '90px', top: '360px', height: '1000px', borderRadius: '80px',
  background: C.surface, border: `2px solid ${C.border}` });
el(results, { left: '280px', top: '430px', width: '520px', height: '520px', borderRadius: '260px',
  border: `34px solid ${C.raised}` }, '', 'res-ring');
const resScore = el(results, { left: '280px', top: '600px', width: '520px', height: '180px', display: 'flex',
  justifyContent: 'center', alignItems: 'center', direction: 'ltr' });
const resNum = roller(resScore, { position: 'relative', width: '110px', height: '180px' },
  { fontWeight: 800, fontSize: '160px', lineHeight: '180px' });
const resDen = document.createElement('span');
Object.assign(resDen.style, { fontWeight: 800, fontSize: '160px', lineHeight: '180px' });
resDen.textContent = '/5';
resScore.appendChild(resDen);
const resTitle = maskWord(results, 'نتيجتك: 5 من 5', { left: 0, right: 0, top: '1050px', height: '130px',

const playAgain = el(results, { left: '150px', right: '150px', top: '1430px', height: '150px', borderRadius: '75px',
  background: C.white, color: C.ink, display: 'flex', alignItems: 'center', justifyContent: 'center',
  fontWeight: 800, fontSize: '56px' }, 'العب مرة ثانية');

// =============================================================== END CARD
const end = layer('end');
el(end, { left: '410px', top: '590px', width: '260px', height: '260px' }, '', 'end-mark');
const eName = maskWord(end, 'تحدّي اليمعة', { left: 0, right: 0, top: '900px', height: '190px', textAlign: 'center' },
  { fontWeight: 800, fontSize: '140px', lineHeight: '190px' });
const eTag = maskWord(end, '6 فئات · 60 سؤال · 15 ثانية', { left: 0, right: 0, top: '1100px', height: '80px',
  textAlign: 'center' }, { fontWeight: 500, fontSize: '52px', lineHeight: '80px', color: C.muted });
const cta = el(end, { left: '260px', top: '1290px', width: '560px', height: '150px', borderRadius: '75px',
  background: C.white, color: C.ink, display: 'flex', alignItems: 'center', justifyContent: 'center',
  fontWeight: 800, fontSize: '60px' }, 'العب الحين', 'cta');
const eLink = maskWord(end, 'trivia-app-phi-two.vercel.app', { left: 0, right: 0, top: '1500px', height: '64px',
  textAlign: 'center' }, { fontWeight: 500, fontSize: '40px', lineHeight: '64px', color: C.muted, direction: 'ltr' });

// =============================================================== THROUGH-LINE OBJECT  (the «؟» tile)
const T = el(stage, { borderStyle: 'solid', borderColor: C.green, zIndex: 50 });
const glyph = (html, style) => el(T, Object.assign({ left: '50%', top: '50%', whiteSpace: 'nowrap', color: C.ink,
  fontWeight: 800 }, style), html);
const gQ = glyph('؟', { fontSize: '1px' });
const gStart = glyph('ابدأ', { fontSize: '44px', lineHeight: '60px' });
const gFF = glyph('50/50 · احذف إجابتين', { fontSize: '42px', lineHeight: '60px' });
const CHECK = '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#0A1620" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const gCheck = glyph(CHECK, { width: '52px', height: '52px' });
const gAns = el(T, { left: 0, top: 0, right: 0, bottom: 0, display: 'flex', alignItems: 'center',
  justifyContent: 'space-between', padding: '0 52px 0 30px', color: C.ink, fontWeight: 800, fontSize: '48px' },
  `<span>روسيا</span><span style="width:52px;height:52px;display:block">${CHECK}</span>`);

// ---------------------------------------------------------------- cursor
const cursor = el(stage, { width: '76px', height: '76px', zIndex: 60, transformOrigin: '12px 8px' },
  '<svg viewBox="0 0 32 32" width="76" height="76"><path d="M6 3l19 13.5-8.6 1.5 5 9.6-3.6 1.9-5-9.7L6 25.5z" fill="#fff" stroke="#0A1620" stroke-width="2" stroke-linejoin="round"/></svg>');

// =============================================================== POSES for the through-line object
/** Shape poses are measured from the live layout each frame, so match cuts stay exact. */
const POSES = {
  hook: () => ({ x: 540, y: 1290, w: 300, h: 300, r: 72, b: 150, rot: -8 }),
  wordmark: () => { const r = rectOf('wm-mark'); return { ...r, r: r.w * 0.24, b: r.w / 2, rot: -8 }; },
  start: () => { const r = rectOf('geo-start'); return { ...r, r: r.h / 2, b: r.h / 2, rot: 0 }; },
  full: () => ({ x: 540, y: 960, w: 2500, h: 2500, r: 0, b: 1250, rot: 0 }),
  ring: () => { const r = rectOf('ring'); return { ...r, r: r.w / 2, b: 26 * (r.w / 300), rot: 0 }; },
  ff: () => { const r = rectOf('ff'); return { ...r, r: r.h / 2, b: r.h / 2, rot: 0 }; },
  check: () => { const r = rectOf('ans-3-icon'); return { ...r, r: r.w / 2, b: r.w / 2, rot: 0 }; },
  answer: () => { const r = rectOf('ans-3'); return { ...r, r: 48 * (r.h / 128), b: r.h / 2, rot: 0 }; },
  results: () => { const r = rectOf('res-ring'); return { ...r, r: r.w / 2, b: 34 * (r.w / 520), rot: 0 }; },
  logo: () => { const r = rectOf('end-mark'); return { ...r, r: r.w * 0.24, b: r.w / 2, rot: -8 }; },
};
const T_TIMELINE = [
  { t: 1.5, pose: 'hook' },
  { t: 2.0, pose: 'wordmark' },
  { t: 4.5, pose: 'start' },
  { t: 5.5, pose: 'full', ease: (s) => expoIn(s / 0.5) },
  { t: 6.0, pose: 'ring', ease: (s) => expoOut(s / 0.5) },
  { t: 8.0, pose: 'ff' },
  { t: 10.0, pose: 'check' },
  { t: 11.0, pose: 'answer' },
  { t: 12.0, pose: 'results' },
  { t: 16.0, pose: 'logo' },
];
const KEYS = ['x', 'y', 'w', 'h', 'r', 'b', 'rot'];
function tPose(t) {
  if (t < T_TIMELINE[0].t) return null;
  let k = 0;
  while (k + 1 < T_TIMELINE.length && t >= T_TIMELINE[k + 1].t) k++;
  const seg = T_TIMELINE[k];
  const target = POSES[seg.pose]();
  if (k === 0) {
    const g = sp(t, seg.t);
    return { ...target, w: target.w * g, h: target.h * g, b: target.b * g, r: target.r * g };
  }
  const from = POSES[T_TIMELINE[k - 1].pose]();
  const s = t - seg.t;
  const p = seg.ease ? seg.ease(s) : spring(s);
  const out = {};
  for (const key of KEYS) out[key] = lerp(from[key], target[key], p);
  return out;
}
/** Timer seconds stepping once per beat from 6.0 s; frozen at 10.5 s when «روسيا» is tapped. */
const timerSteps = (t) => Math.min(9, Math.max(0, Math.floor((t - 6) / BEAT)));
function timerFraction(t) {
  const k = timerSteps(t);
  const n = k === 0 ? 0 : k - 1 + spring(t - 6 - k * BEAT);
  return 1 - n / 15;
}
/** Arc of the through-line object: 1 = whole shape. */
function tArc(t) {
  if (t < 6) return 1;
  if (t < 8) return timerFraction(t);
  if (t < 12) return lerp(timerFraction(8), 1, spring(t - 8));
  if (t < 12.5) return lerp(1, 0.2, spring(t - 12));
  if (t < 16) {
    // One fifth per beat: 1/5 at 12.5 s … 5/5 at 14.5 s.
    const j = clamp(Math.floor((t - 13) / BEAT) + 1, 0, 4);
    const m = j === 0 ? 0 : j - 1 + spring(t - 13 - (j - 1) * BEAT);
    return Math.min(1, 0.2 + 0.2 * m);
  }
  return 1;
}
const glyphScale = (t, tin, tout) => clamp(sp(t, tin)) * (1 - ex(t, tout, 0.25));

// =============================================================== seek(t): everything computed from t
window.seek = function seek(t) {
  // ---- layer visibility (hard cuts are always covered by masks or the through-line object)
  for (const [name, node] of [['hook', hook], ['welcome', welcome], ['game', game], ['results', results], ['end', end]]) {
    node.style.visibility = visible(name, t) ? 'visible' : 'hidden';
  }

  // ---- HOOK (zoom 1.00 → 1.04)
  camera(hook, t, 0, 2, 1.0, 1.04, { x: 540, y: 960 });
  const nudge = -80 * sp(t, 1.5);
  hookLine1.style.transform = `translateY(${nudge}px)`;
  hookLine2.style.transform = `translateY(${nudge}px)`;
  hW1.inner.style.transform = `translateY(${maskY(t, 0.0, 2.0)}%)`;
  hW2.inner.style.transform = `translateY(${maskY(t, 0.5, 2.04)}%)`;
  hW3.inner.style.transform = `translateY(${maskY(t, 1.0, 2.08)}%)`;

  // ---- WELCOME (zoom 1.04 → 1.08)
  const unfold = ex(t, 2.0, 0.35);
  welcome.style.clipPath = `inset(0 0 ${(1 - unfold) * 100}% 0)`;
  const scroll = 600 * sp(t, 4.05);
  wContent.style.transform = `translateY(${-scroll}px)`;
  const focusTop = { x: 540, y: 300 };
  const focusCard = { x: 782, y: GRID_TOP + CARD_H + GAP + 541 - 600 };
  camera(welcome, t, 2.0, 6.0, 1.04, 1.08, mixPoint(focusTop, focusCard, sp(t, 4.05)));
  wName.inner.style.transform = `translateY(${maskY(t, 2.2)}%)`;
  wHello.inner.style.transform = `translateY(${maskY(t, 2.5)}%)`;
  wTag.inner.style.transform = `translateY(${maskY(t, 2.6)}%)`;
  const bOpen = sp(t, 3.0);
  banner.style.clipPath = `inset(0 0 ${(1 - clamp(bOpen)) * 100}% 0 round 66px)`;
  banner.style.transform = `scale(${lerp(0.94, 1, clamp(bOpen))})`;
  wSection.inner.style.transform = `translateY(${maskY(t, 3.5)}%)`;
  cards.forEach((card, i) => {
    card.style.transform = `scale(${sp(t, 3.5 + i * 0.06)})`;
  });

  // ---- GAME (zoom 1.08 → 1.12, focus ring → 50/50 → «روسيا»)
  const fRing = { x: 540, y: 440 }, fMid = { x: 540, y: 1210 }, fAns = { x: 540, y: 1600 };
  const gFocus = mixPoint(mixPoint(fRing, fMid, sp(t, 8.0)), fAns, sp(t, 10.0));
  camera(game, t, 6.0, 12.0, 1.08, 1.12, gFocus);
  const fold = ex(t, 12.0, 0.35);
  game.style.clipPath = `inset(${fold * 50}% 0 ${fold * 50}% 0)`;
  gCat.inner.style.transform = `translateY(${maskY(t, 6.15)}%)`;
  gProg.inner.style.transform = `translateY(${maskY(t, 6.25)}%)`;
  scorePill.style.transform = `scale(${sp(t, 6.2)})`;
  setRoller(scoreRoll, ['0', '1'], [0, 11.5], t);
  ringWhite.style.visibility = t >= 8.0 ? 'visible' : 'hidden';
  const wf = timerFraction(Math.min(t, 10.5));
  ringWhite.style.webkitMaskImage = ringWhite.style.maskImage =
    `conic-gradient(#000 ${wf * 360}deg, transparent ${wf * 360}deg)`;
  const secTimes = [6.0];
  for (let k = 1; k <= 9; k++) secTimes.push(6 + k * BEAT);
  setRoller(secRoll, secTimes.map((_, k) => String(15 - k)), secTimes, t);
  secRoll.box.style.transform = `scale(${sp(t, 6.1)})`;
  const qOpen = clamp(sp(t, 6.5));
  qCard.style.clipPath = `inset(0 0 ${(1 - qOpen) * 100}% 0 round 70px)`;
  ffPill.style.transform = `scale(${sp(t, 7.0)})`;
  setRoller(ffLabel, ['50/50 · احذف إجابتين', '50/50 · استخدمته'], [0, 10.0], t);
  ffLabel.a.style.color = ffLabel.b.style.color = t >= 10.0 ? C.muted : C.white;
  answers.forEach((a, i) => {
    a.row.style.transform = `scale(${sp(t, 7.0 + i * 0.07)})`;
    const removed = i === 0 || i === 2;
    const cut = removed ? ex(t, 9.0, 0.4) : 0;
    a.fill.style.transform = `scaleX(${1 - cut})`;
    a.label.style.clipPath = `inset(0 0 0 ${cut * 100}%)`;
    a.label.style.color = t >= 11.0 && i !== 3 ? C.muted : C.white;
  });
  captions.forEach((c) => {
    c.inner.style.transform = `translateY(${maskY(t, c.tin, c.tout)}%)`;
  });

  // ---- RESULTS (zoom 1.12 → 1.16)
  camera(results, t, 12.0, 16.0, 1.12, 1.16, { x: 540, y: 760 });
  const rOpen = ex(t, 12.05, 0.45), rFold = ex(t, 16.0, 0.35);
  results.style.clipPath = `inset(${(1 - rOpen) * 50 + rFold * 50}% 0 ${(1 - rOpen) * 50 + rFold * 50}% 0)`;
  const scoreTimes = [12.5, 13.0, 13.5, 14.0, 14.5];
  setRoller(resNum, ['1', '2', '3', '4', '5'], scoreTimes, t);
  resScore.style.transform = `scale(${sp(t, 12.15)})`;
  resTitle.inner.style.transform = `translateY(${maskY(t, 15.0)}%)`;
  playAgain.style.transform = `scale(${sp(t, 15.5)})`;
  resCard.style.transform = `scale(${lerp(0.96, 1, clamp(sp(t, 12.05)))})`;

  // ---- END (zoom 1.16 → 1.20)
  camera(end, t, 16.0, 20.0, 1.16, 1.2, { x: 540, y: 900 });
  eName.inner.style.transform = `translateY(${maskY(t, 16.5)}%)`;
  eTag.inner.style.transform = `translateY(${maskY(t, 17.0)}%)`;
  cta.style.transform = `scale(${sp(t, 17.5) * (1 - 0.05 * press(t, 19.0))})`;
  eLink.inner.style.transform = `translateY(${maskY(t, 18.0)}%)`;

  // ---- THROUGH-LINE OBJECT (measured after all layers are positioned)
  const pose = tPose(t);
  if (!pose || pose.w < 0.5) {
    T.style.visibility = 'hidden';
  } else {
    T.style.visibility = 'visible';
    let { x, y, w, h, r, b, rot } = pose;
    const dip = 1 - 0.06 * (press(t, 5.0) + press(t, 8.5));
    w *= dip; h *= dip; b *= dip; r *= dip;
    if (t >= 16) rot += 8 * sp(t, 18.5) - 8 * sp(t, 19.5);
    // Blur follows speed on fast moves.
    const prev = tPose(t - 1 / 120);
    const speed = prev ? Math.hypot(x - prev.x, y - prev.y) * 120 : 0;
    const blur = Math.min(10, speed / 900);
    Object.assign(T.style, {
      left: x - w / 2 + 'px', top: y - h / 2 + 'px', width: w + 'px', height: h + 'px',
      borderRadius: Math.min(r, Math.min(w, h) / 2) + 'px', borderWidth: Math.min(b, Math.min(w, h) / 2) + 'px',
      transform: `rotate(${rot}deg)`, filter: blur > 0.4 ? `blur(${blur}px)` : 'none',
    });
    const arc = tArc(t);
    T.style.webkitMaskImage = T.style.maskImage =
      arc >= 0.999 ? 'none' : `conic-gradient(#000 ${arc * 360}deg, transparent ${arc * 360}deg)`;
    // Glyphs grow in and shrink out; they never just appear.
    const qScale = Math.max(glyphScale(t, 1.55, 4.5), glyphScale(t, 16.15, 99));
    const qSize = w * 0.62;
    Object.assign(gQ.style, { fontSize: qSize + 'px', lineHeight: qSize * 1.3 + 'px',
      transform: `translate(-50%, -54%) scale(${qScale})` });
    gStart.style.transform = `translate(-50%, -50%) scale(${glyphScale(t, 4.6, 5.55)})`;
    gFF.style.transform = `translate(-50%, -50%) scale(${glyphScale(t, 8.1, 10.0)})`;
    gCheck.style.transform = `translate(-50%, -50%) scale(${glyphScale(t, 10.1, 11.0)})`;
    const ansScale = glyphScale(t, 11.08, 12.0);
    gAns.style.transform = `scale(${ansScale})`;
    gAns.style.visibility = ansScale > 0.01 ? 'visible' : 'hidden';
  }

  // ---- CURSOR: real drags and taps
  const geo = rectOf('geo-start'), ff = rectOf('ff'), ans3 = rectOf('ans-3'), ctaR = rectOf('cta');
  const tip = (r) => ({ x: r.x, y: r.y });
  const path = [
    { t: 4.0, p: { x: 760, y: 1700 } },
    { t: 4.05, p: { x: 760, y: 1100 } }, // drag the page up
    { t: 4.55, p: tip(geo) },
    { t: 7.6, p: { x: 760, y: 1700 } },
    { t: 8.2, p: tip(ff) },
    { t: 10.05, p: { x: ans3.x - 120, y: ans3.y } },
    { t: 18.5, p: { x: 760, y: 1760 } },
    { t: 18.6, p: tip(ctaR) },
  ];
  let k = 0;
  while (k + 1 < path.length && t >= path[k + 1].t) k++;
  const from = path[Math.max(0, k - 1)].p, to = path[k].p;
  const cp = k === 0 ? to : mixPoint(from, to, spring(t - path[k].t));
  const grow = Math.max(
    sp(t, 3.95) * (1 - ex(t, 5.55, 0.25)),
    sp(t, 7.95) * (1 - ex(t, 11.2, 0.25)),
    sp(t, 18.55) * (1 - ex(t, 19.6, 0.25)),
  );
  const tap = 1 - 0.18 * (press(t, 5.0) + press(t, 8.5) + press(t, 10.5) + press(t, 19.0));
  const drag = t >= 4.05 && t < 4.5 ? 0.9 : 1;
  cursor.style.visibility = grow > 0.01 ? 'visible' : 'hidden';
  cursor.style.left = cp.x - 12 + 'px';
  cursor.style.top = cp.y - 8 + 'px';
  cursor.style.transform = `scale(${grow * tap * drag})`;
};

// =============================================================== SOUNDTRACK (OfflineAudioContext → WAV)
window.renderAudio = async function renderAudio() {
  const rate = 48000;
  const ctx = new OfflineAudioContext(2, rate * DURATION, rate);
  const master = ctx.createGain();
  master.gain.value = 0.8;
  master.connect(ctx.destination);
  const noiseBuf = ctx.createBuffer(1, rate, rate);
  const nd = noiseBuf.getChannelData(0);
  let seed = 7;
  for (let i = 0; i < nd.length; i++) { seed = (seed * 16807) % 2147483647; nd[i] = (seed / 2147483647) * 2 - 1; }

  const kick = (t, gain = 1) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
  };
  const noise = (t, dur, gain, type, freq) => {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + 0.02);
  };
  const tone = (t, freq, dur, gain, type = 'triangle', cutoff = 900) => {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  };
  // A minor: A – F – C – G, one chord per bar.
  const roots = [55, 43.65, 65.41, 49.0];
  const chords = [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
  const beats = DURATION / BEAT;
  for (let b = 0; b < beats; b++) {
    const t = b * BEAT;
    kick(t, b % 4 === 0 ? 1 : 0.85);
    noise(t + BEAT / 2, 0.05, 0.18, 'highpass', 8000);
    if (b % 2 === 1) noise(t, 0.12, 0.22, 'bandpass', 2200);
    const bar = Math.floor(b / 4) % 4;
    if (t >= 2) {
      tone(t, roots[bar], 0.22, 0.32, 'triangle', 500);
      tone(t + BEAT / 2, roots[bar] * 2, 0.16, 0.18, 'triangle', 700);
    }
  }
  // A hit on every scene change; the biggest on the payoff.
  const hits = [[2, 0.7], [6, 0.8], [8, 0.6], [10, 0.6], [12, 1], [16, 0.8], [19.5, 0.9]];
  hits.forEach(([t, g], i) => {
    noise(t, g >= 1 ? 1.4 : 0.6, 0.35 * g, 'lowpass', 5000);
    tone(t, 55, 0.6, 0.5 * g, 'sine', 200);
    for (const f of chords[i % 4]) tone(t, f, 0.9, 0.08 * g, 'sawtooth', 1400);
  });
  const buf = await ctx.startRendering();
  // 16-bit PCM WAV
  const ch = [buf.getChannelData(0), buf.getChannelData(1)];
  const n = buf.length, bytes = 44 + n * 4, dv = new DataView(new ArrayBuffer(bytes));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); str(8, 'WAVEfmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, rate, true);
  dv.setUint32(28, rate * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, n * 4, true);
  let off = 44, peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(ch[0][i]), Math.abs(ch[1][i]));
  const norm = peak > 0.95 ? 0.95 / peak : 1;
  for (let i = 0; i < n; i++) for (let c = 0; c < 2; c++) {
    dv.setInt16(off, clamp(ch[c][i] * norm, -1, 1) * 32767, true); off += 2;
  }
  let bin = '';
  const u8 = new Uint8Array(dv.buffer);
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
};

window.ready = Promise.all([
  document.fonts.load('800 100px Taj'), document.fonts.load('700 100px Taj'), document.fonts.load('500 100px Taj'),
  ...CARDS.map((c) => { const img = new Image(); img.src = `../assets/images/category-${c.slug}.png`; return img.decode(); }),
]).then(() => document.fonts.ready).then(() => { window.seek(0); return true; });
